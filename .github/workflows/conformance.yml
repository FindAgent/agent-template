name: Conformance

# The variants must keep meeting the platform contract (node/ and python/ stay one agent in two languages), the
# generated assistant files must match AGENTS.md, and a repository scaffolded from each variant must pass its own gates.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Variants meet the contract and the CLI is pinned
        run: python scripts/check_conformance.py
      - name: MCP client configs are generated from findagent.json
        run: python scripts/sync_mcp_configs.py --check
      - name: Assistant entry files are generated from AGENTS.md
        run: python scripts/build_adapters.py --check
      - name: The helper scripts are lint-clean (the scaffold copies check_repo_files.py into every new agent)
        run: |
          pip install ruff==0.16.9 mypy==2.3.1
          ruff check scripts
          mypy --strict scripts/check_repo_files.py scripts/build_adapters.py scripts/check_conformance.py scripts/check_scaffold.py
      - name: The platform's own check accepts the no-code variants (CLI pinned in scripts/cli-version.txt)
        run: |
          cli="@findagent/cli@$(cat scripts/cli-version.txt)"
          npx --yes "$cli" check package
          npx --yes "$cli" check actions

  scaffold:
    # A new agent starts from what init_agent.py writes, not from the folder in this repository, so the gates run there.
    needs: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [node, python, framework, package, actions, listing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        if: matrix.variant == 'node'
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scaffold ${{ matrix.variant }} and run the gates of the new repository, then the pinned platform CLI
        run: python scripts/check_scaffold.py ${{ matrix.variant }}
