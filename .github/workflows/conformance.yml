name: Conformance

# The node/ and python/ variants must stay one agent in two languages.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_conformance.py
      - run: python scripts/sync_mcp_configs.py --check
      - name: A scaffolded repo of each variant is complete
        run: |
          python scripts/init_agent.py python "$RUNNER_TEMP/py-agent" --name "CI Python"
          python scripts/init_agent.py node "$RUNNER_TEMP/node-agent" --name "CI Node"
          python scripts/init_agent.py framework "$RUNNER_TEMP/framework-agent" --name "CI Framework"
          python scripts/init_agent.py package "$RUNNER_TEMP/package-agent" --name "CI Package"
          python scripts/init_agent.py actions "$RUNNER_TEMP/actions-agent" --name "CI Actions"
          python scripts/init_agent.py listing "$RUNNER_TEMP/listing-agent" --name "CI Listing"
      - name: The platform's own check accepts the no-code variants
        run: |
          npx --yes @findagent/cli@0.4.2 check package
          npx --yes @findagent/cli@0.4.2 check actions
