name: Python agent

# Every step is one of the gates described in python/README.md. Nothing here needs a secret.
# Copying python/ out as your own repo? Move this file to .github/workflows/ci.yml and delete the
# `defaults` block and the `paths` filters.

on:
  push:
    branches: [main]
    paths: ["python/**", ".github/workflows/python.yml"]
  pull_request:
    branches: [main]
    paths: ["python/**", ".github/workflows/python.yml"]

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - name: Install exactly what the sandbox installs, plus the dev tools
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy agent_template server.py scripts
      - name: Compile
        run: python -m compileall -q agent_template server.py scripts
      - name: Chromium for the panel tests
        run: python -m playwright install --with-deps chromium
      - name: Tests
        run: pytest
      - name: Generated files are current
        run: python scripts/sync_manifest.py --check && python scripts/build_panel.py --check
      - name: Platform rules, including a binary wheel for every pin
        run: python scripts/check_platform.py --wheels
